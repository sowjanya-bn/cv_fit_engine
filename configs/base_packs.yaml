# Base packs define deterministic "always include" blocks for a target role.
# These act as a strong baseline even when JD matching is weak.

default:
  required_experience_ids: []
  required_project_ids: []
  min_experience_blocks: 2
  min_project_blocks: 1

ai_engineer:
  # Core narrative: applied AI + KG/RAG + production backend maturity
  required_experience_ids:
    - exp_001  # AI Research Engineer (current)
    - exp_002  # Research Intern — KG-RAG, evaluation
    - exp_003  # Senior Backend Engineer — distributed systems, APIs
  anchor_sets:
    ai_first:
      - exp_001
      - exp_002
    eng_first:
      - exp_003
      - exp_001
  required_project_ids:
    - proj_001  # Stock Price ML Analysis
  min_experience_blocks: 3
  min_project_blocks: 1

backend_engineer:
  required_experience_ids:
    - exp_003  # Senior Backend Engineer
    - exp_004  # Backend Systems Engineer
  required_project_ids:
    - proj_001
  min_experience_blocks: 2
  min_project_blocks: 1

data_scientist:
  required_experience_ids:
    - exp_001
    - exp_002
  required_project_ids:
    - proj_001
  min_experience_blocks: 2
  min_project_blocks: 1

research_engineer:
  required_experience_ids:
    - exp_001
    - exp_002
  required_project_ids:
    - proj_001
  min_experience_blocks: 2
  min_project_blocks: 1
